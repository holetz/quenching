# Copy to .github/workflows/docs.yml to publish the site to GitHub Pages on push to main.
# Prerequisite: the repository's Pages source must be set to "GitHub Actions" (Settings → Pages).
# The built site/ is uploaded as a Pages artifact; there is no deploy subcommand.
name: docs
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - run: zensical build --clean   # no cache on CI while Zensical's caching is in flux
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
