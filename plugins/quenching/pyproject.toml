[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quenching-mcp"
dynamic = ["version"]
description = "The quenching CLI and stdio MCP server"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quenching-mcp = "quenching_plugin.launch:mcp"
cq = "quenching_plugin.launch:cq"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
include = ["/**"]
exclude = ["/dist", "**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.sources]
"" = "quenching_plugin"

[tool.hatch.build.targets.wheel.force-include]
"assets/bin/quenching_launch.py" = "launch.py"
