<!DOCTYPE html>
<!--
  OKF bundle viewer — shell for okf-visualize.py (claude-quenching plugin).
  Adapted from okf/src/reference_agent/viewer/templates/viz.html in
  https://github.com/GoogleCloudPlatform/knowledge-catalog (Apache-2.0).
  Cytoscape.js and marked (both MIT) are inlined offline in place of the CDN
  <script src> tags. See viewer/vendor/LICENSES.md for the notices.
  Placeholders below are filled by okf-visualize.py — do not remove them.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKF Bundle Viewer</title>
<style>
/*__VIZ_CSS__*/
</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
    <span class="muted" id="counts"></span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type"><option value="">All types</option></select>
    <select id="filter-home"><option value="">All homes</option></select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph">
    <div id="legend" class="legend"></div>
    <div id="empty-graph" class="muted" hidden>No concept docs found in this bundle.</div>
  </section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Home</dt><dd id="detail-home"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Timestamp</dt><dd id="detail-timestamp"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

<script>
/*__CYTOSCAPE_JS__*/
</script>
<script>
/*__MARKED_JS__*/
</script>
<script>
window.BUNDLE_NAME = __BUNDLE_NAME__;
window.BUNDLE = __BUNDLE_DATA__;
</script>
<script>
/*__VIZ_JS__*/
</script>
</body>
</html>
