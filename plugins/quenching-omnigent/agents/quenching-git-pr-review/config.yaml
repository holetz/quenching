spec_version: 1
name: "quenching-git-pr-review"
description: "Fetch a PR's unresolved review threads and address each on the human's confirmation. Use for \"resolve PR comments\", \"address the review feedback\". Not for: opening a PR → quenching-git-pr-create."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"sys_os_write\", \"Write\", \"write\", \"NotebookEdit\", \"Grep\", \"grep\", \"Glob\", \"glob\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\", \"sys_session_create\", \"Task\", \"Agent\", \"task\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((event.type == \"tool_call\" && event.data.name in [\"sys_os_shell\", \"Bash\", \"Shell\", \"bash\"] && !(\"arguments\" in event.data && \"command\" in event.data.arguments && type(event.data.arguments.command) == string && event.data.arguments.command.matches(r\"^[ \\t]*cq(?: [^;&|<>$`\\\\\\n]*)?(?:[ \\t]*(?:&&|\\|\\||;)[ \\t]*cq(?: [^;&|<>$`\\\\\\n]*)?)*[ \\t]*$\"))) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
