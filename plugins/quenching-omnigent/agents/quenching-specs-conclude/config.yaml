spec_version: 1
name: "quenching-specs-conclude"
description: "Close ONE spec out: review the branch, write knowledge, archive, prove the gate, hand off to a PR or merge. Use for \"conclude this spec\", \"close it out\", \"abandon this spec\". Not for: building → quenching-specs-execute."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"NotebookEdit\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\", \"sys_session_create\", \"Task\", \"Agent\", \"task\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((false) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
