spec_version: 1
name: "quenching-handoff"
description: "Compact the current conversation into a handoff document for another agent to continue. Use for \"generate a handoff\" or \"prepare a handoff for the next session\". Not for: implementing → the owning command."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"sys_os_edit\", \"Edit\", \"MultiEdit\", \"edit\", \"NotebookEdit\", \"Grep\", \"grep\", \"Glob\", \"glob\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\", \"sys_session_create\", \"Task\", \"Agent\", \"task\", \"Skill\", \"sys_os_shell\", \"Bash\", \"Shell\", \"bash\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((false) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
