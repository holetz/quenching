spec_version: 1
name: "quenching-knowledge-align"
description: "Force /docs/ into the canonical OKF v0.1 bundle and absorb out-of-band content until stable. Use for \"align the docs\", \"set up /docs/\", \"converge the knowledge base\". Not for: one item → quenching-knowledge-add."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
spawn: true
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"NotebookEdit\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((false) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
