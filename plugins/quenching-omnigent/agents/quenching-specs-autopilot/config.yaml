spec_version: 1
name: "quenching-specs-autopilot"
description: "Run ONE improvement round (triage, map, epic, orchestrate, review, gate); `--until-dry` or `--until` repeat rounds until a dry queue or a deadline. Use for \"run the autopilot until 7am\". Not for: ONE epic → quenching-specs-orchestrate; owner-decided map → quenching-specs-improve."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
spawn: true
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"sys_os_write\", \"Write\", \"write\", \"sys_os_edit\", \"Edit\", \"MultiEdit\", \"edit\", \"NotebookEdit\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\", \"Skill\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((false) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
