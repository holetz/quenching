spec_version: 1
name: "quenching-components-command-eval"
description: "Measure whether a command teaches anything with with/without runs graded on evidence. Use for \"run the with/without eval on this skill\". Not for: unevidenced edits → quenching-components-command-new."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
os_env:
  type: caller_process
  cwd: .
spawn: true
guardrails:
  policies:
    source_tools:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: "(event.type == \"tool_call\" && event.data.name in [\"NotebookEdit\", \"WebFetch\", \"webfetch\", \"WebSearch\", \"websearch\", \"Skill\"]) ? {\"result\": \"DENY\", \"reason\": \"Tool not granted by the quenching source.\"} : ((event.type == \"tool_call\" && event.data.name in [\"sys_os_shell\", \"Bash\", \"Shell\", \"bash\"] && !(\"arguments\" in event.data && \"command\" in event.data.arguments && type(event.data.arguments.command) == string && event.data.arguments.command.matches(r\"^[ \\t]*cq(?: [^;&|<>$`\\\\\\n]*)?(?:[ \\t]*(?:&&|\\|\\||;)[ \\t]*cq(?: [^;&|<>$`\\\\\\n]*)?)*[ \\t]*$\"))) ? {\"result\": \"DENY\", \"reason\": \"Shell call outside the granted cq verbs.\"} : {\"result\": \"ALLOW\"})"
          reason: "Denied by the quenching source tool grant."
