<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quenching specs</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <h1>Quenching specs</h1>
  <nav aria-label="Views" id="nav">
    <a href="#/board" data-view="board">Board</a>
    <a href="#/list" data-view="list">Ranking</a>
    <a href="#/human" data-view="human" id="nav-human">Decidir com o humano <span id="human-count" class="count" aria-label="waiting for the human">0</span></a>
    <a href="#/epics" data-view="epics" id="nav-epics" hidden>Epics</a>
    <a href="#/sessions" data-view="sessions" id="nav-sessions" hidden>Sessões <span id="sessions-count" class="count" aria-label="sessions waiting for you">0</span></a>
    <a href="#/chat" data-view="chat" id="nav-chat" hidden>Chat</a>
  </nav>
  <form role="search" id="search-form">
    <label class="sr" for="q">Search specs</label>
    <input id="q" type="search" placeholder="Search all specs  ( / )" autocomplete="off">
  </form>
  <div class="fresh">
    <span id="fresh" aria-live="off">loading</span>
    <button id="notify" type="button" aria-pressed="false">Notifications: off</button>
    <button id="refresh" type="button">Refresh</button>
    <button id="capture" type="button" class="primary">Capture</button>
  </div>
</header>
<p id="banner" class="banner" role="status" hidden></p>
<div class="shell">
  <nav id="projects" class="projects" aria-label="Projetos" hidden></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toasts" role="alert" aria-live="assertive"></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></aside>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<script src="/app.js"></script>
</body>
</html>
