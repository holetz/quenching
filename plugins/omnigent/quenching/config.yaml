spec_version: 1
name: "quenching"
description: "The quenching operator: the plugin's commands as skills, its agents as sub-agents and the quenching MCP server."
instructions: instructions.md
executor:
  type: omnigent
  config:
    harness: opencode
skills: none
os_env:
  type: caller_process
  cwd: .
tools:
  agents: ["git-steward", "orchestrator", "reviewer", "scout", "spec-architect", "spec-runner", "verifier"]
  quenching:
    type: mcp
    command: uvx
    args: ["--from", "git+https://github.com/holetz/quenching@6.11.0#subdirectory=plugins/quenching", "quenching-mcp"]
