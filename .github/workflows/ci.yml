name: CI

# The repository gate runs once per commit: on pushes to main and on pull requests. A pull request
# push is covered by the pull_request event alone, and the `quenching` specs-store branch (a
# data branch, never code) triggers nothing.
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [quenching]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      # One suite execution per cell: the gate runs it once, randomized and parallel, under
      # pytest-randomly/pytest-xdist/pytest-cov, and the floor reads that same artifact. The
      # deterministic checks (doctors, generated trees, docs build) read the same checkout
      # whatever the interpreter, so the newest Python only adds the compatibility run.
      - name: Full repository gate on the floor Python (unit tests under pytest-randomly, floor, doctors, builds)
        if: matrix.python-version == '3.11'
        env:
          PYTEST_RANDOMLY_SEED: ${{ github.run_id }}
        run: uv run bash scripts/verify_repo.sh
      - name: Unit suite on the newest supported Python
        if: matrix.python-version != '3.11'
        run: uv run pytest plugins/quenching/tests -q -p randomly -n auto --randomly-seed=${{ github.run_id }}

  windows:
    name: Windows (focused tests, no administrator rights)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Process group helper
        run: python -m unittest discover -s plugins/quenching/tests -p test_windows_process.py
      - name: Tool spawn without cmd.exe
        run: python -m unittest discover -s plugins/quenching/tests -p test_windows_tools.py
      - name: Live session liveness
        run: python -m unittest discover -s plugins/quenching/tests -p test_session_live.py
      - name: Junction fallback
        run: python -m unittest discover -s plugins/quenching/tests -p test_windows_links.py

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff (E, F)
        run: uv run ruff check .

  distribution:
    name: Codex marketplace upgrade (6.4.0 to candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The upgrade starts from the actual published 6.4.0 package.
      - name: Install the tested Codex host
        run: npm install --global @openai/codex@0.163.0
      - name: Upgrade through Git marketplace in an isolated home (no model calls)
        run: python3 scripts/check_codex_upgrade.py

  functional:
    name: Functional checks (static guards only; the surface-load measurement runs in the opt-in gate and the release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Static guard (selfcheck)
        run: bash plugins/quenching/assets/checks/functional-checks.sh --selfcheck
      - name: Observed-path guard (selftest)
        run: bash plugins/quenching/assets/checks/functional-checks.sh --selftest
      - name: Where the surface-load measurement runs
        run: echo "CI measures no surface load (no claude CLI here). Run QUENCHING_FUNCTIONAL=1 bash scripts/verify_repo.sh locally; /release requires it before the bump."
