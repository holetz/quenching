name: Sync Codex plugin

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Generate the Codex snapshot and upload it as an artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check source conversion
        if: inputs.apply != true
        run: python3 plugins/quenching/assets/bin/cq --root . components translate --check --json
      - name: Generate snapshot
        if: inputs.apply == true
        run: python3 plugins/quenching/assets/bin/cq --root . components translate --write
      - name: Validate Codex manifest
        if: inputs.apply == true
        run: python3 scripts/validate_codex_plugin.py plugins/quenching-codex
      - name: Upload generated snapshot
        if: inputs.apply == true
        uses: actions/upload-artifact@v4
        with:
          name: quenching-codex
          path: plugins/quenching-codex/
