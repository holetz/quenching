name: Sync Codex plugin

on:
  push:
    paths:
      - 'plugins/quenching/**'
      - 'plugins/quenching-codex/**'
      - '.github/workflows/sync-codex-plugin.yml'
  pull_request:
    paths:
      - 'plugins/quenching/**'
      - 'plugins/quenching-codex/**'
      - '.github/workflows/sync-codex-plugin.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check source conversion
        run: python3 plugins/quenching/assets/bin/cq --root . components translate --check --json
