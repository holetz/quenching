# uv.lock serves only the documentation site (zensical) and the tests (pytest); the plugin itself is stdlib-only.
[project]
name = "quenching-documentation"
version = "0.1.0"
description = "Development and validation environment for the quenching documentation plugin"
requires-python = ">=3.11"
dependencies = [
  "zensical>=0.0.57",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "coverage>=7.0",
  "pytest-randomly>=3.15",
  "ruff>=0.6",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
]

[tool.uv]
# This repository is the quenching source (installed into targets by `cq deploy`), not a Python package.
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["tests: the single declared proof layer (quenching/tests)",
           "integration: git- and subprocess-heavy tests, skipped by the affected run"]

[tool.coverage.run]
source = ["quenching/assets/bin/quenching"]

[tool.ruff]
target-version = "py311"
# `.agents/quenching/` is the byte copy of quenching installed by `cq deploy`, linted once as
# the source.
extend-exclude = ["site", "site-source", ".agents", ".opencode", ".quenching"]

[tool.ruff.lint]
select = ["E", "F"]
# Line length is not gated: the tree has long prose strings and no formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The stdlib-only package re-exports shared names and keeps compatibility imports on purpose; the
# remaining findings are in code a generated copy mirrors, so they are acknowledged, not rewritten.
"quenching/assets/bin/quenching/**" = ["F401", "F841", "E741", "F541"]
"quenching/assets/bin/quenching/proof/ratchet.py" = ["F401", "F821"]  # unreachable tail after the SQLite reader
