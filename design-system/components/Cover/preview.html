<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quenching Portal</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .heat { fill: var(--accent); }
  .tint { fill: var(--surface-3); }
  .deep { fill: var(--ink); }
  .card { fill: var(--surface); }
  .ground { fill: var(--bg); }
  .ready { fill: var(--stage-ready); }
  .approved { fill: var(--stage-approved); }
  .executing { fill: var(--stage-executing); }
  .blocked { fill: var(--stage-blocked); }
  .lane { rx: var(--radius-2); }
  .tile { rx: var(--radius-1); }
  .mark { rx: var(--radius-0); }
  .words { position: absolute; left: var(--space-7); bottom: var(--space-7); max-width: 440px; }
  .name { margin: 0; font-size: 76px; line-height: .95; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: var(--space-4) 0 0 3px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 140×236 bled off the top (the brand, the largest) · surface-3 160×236 (the tint) · ink 160×172 bled off the right edge · four stage marks 28×12, small because they only ever mean a state — about 40% of 960×288
  arrangement three board lanes side by side, bottoms on one line, in the order the portal reads them
  pattern     tiles, from "dense, modular UI": cards stacked in lanes at a space-7 pitch, cut from the ground; one tile in the tint burns accent, because the one rule of the system is that heat marks what waits for the human
  scales      gutters space-5; card inset space-5; pitch 36 (space-7 + space-3); corners radius-2 on lanes, radius-1 on tiles, radius-0 on marks
-->
<rect class="heat lane" x="0" y="-20" width="140" height="284" rx="10"/>
<rect class="tint lane" x="156" y="28" width="160" height="236" rx="10"/>
<rect class="deep lane" x="332" y="92" width="168" height="172" rx="10"/>
<rect class="ready mark" x="332" y="60" width="28" height="12" rx="4"/>
<rect class="approved mark" x="368" y="60" width="28" height="12" rx="4"/>
<rect class="executing mark" x="404" y="60" width="28" height="12" rx="4"/>
<rect class="blocked mark" x="440" y="60" width="28" height="12" rx="4"/>
<rect class="card tile" x="172" y="44" width="128" height="28" rx="6"/>
<rect class="card tile" x="172" y="80" width="128" height="28" rx="6"/>
<rect class="heat tile" x="172" y="116" width="128" height="28" rx="6"/>
<rect class="card tile" x="172" y="152" width="128" height="28" rx="6"/>
<rect class="card tile" x="172" y="188" width="128" height="28" rx="6"/>
<rect class="card tile" x="172" y="224" width="128" height="28" rx="6"/>
<rect class="ground tile" x="348" y="108" width="132" height="28" rx="6"/>
<rect class="ground tile" x="348" y="144" width="132" height="28" rx="6"/>
<rect class="ground tile" x="348" y="180" width="132" height="28" rx="6"/>
<rect class="ground tile" x="348" y="216" width="132" height="28" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Quenching<br>Portal</h1>
<p class="tag">Heat marks what waits for the human.</p>
</div>
</div>
</body>
</html>
