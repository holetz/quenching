<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenLoading</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="app" style="--app-h:900px">
<a class="skip" href="#main">Ir para o conteúdo</a>
<header class="top"><h1 class="brand"><a href="#/board"><span class="mark" aria-hidden="true">Q</span> Quenching <span class="brand-sub">specs</span></a></h1><nav class="nav" aria-label="Visões"><a href="#/board" aria-current="page"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h3v11h-3zM6.5 2.5h3v7h-3zM10.5 2.5h3v9h-3z"/></svg>Board</a><a href="#/list"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13.5v-4h3v4M6.5 13.5v-11h3v11M10 13.5v-7h3v7"/></svg>Ranking</a><a href="#/human"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5v-5L3.5 5.5M8 8.5l4.5-3M3.5 2.5v3h3M12.5 2.5v3h-3"/></svg>Decidir <span class="count" aria-label="esperando você">0</span></a><a href="#/epics"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l6 3-6 3-6-3 6-3ZM2 8l6 3 6-3M2 11l6 3 6-3"/></svg>Épicos</a><a href="#/gantt"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h6M5.5 8h6M8.5 12.5h5"/></svg>Gantt</a><a href="#/sessions"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h11v10h-11zM5 6l2.5 2L5 10M8.5 10.5H11"/></svg>Sessões</a><a href="#/chat"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3h11v8H7l-3 2.5V11H2.5z"/></svg>Chat</a></nav>
<div class="top-actions">
<button type="button" class="searchbtn" aria-haspopup="dialog"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 12A5 5 0 1 0 7 2a5 5 0 0 0 0 10Zm7 2-3.5-3.5"/></svg><span class="searchbtn-label">Buscar ou executar</span> <kbd>Ctrl K</kbd></button>
<button type="button" class="ghost icon theme" aria-label="Tema: automático" title="Tema (t)"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12Zm0-12v12M8 5h3.6M8 8h4.9M8 11h3.6"/></svg></button>
<button type="button" class="ghost icon helpbtn" aria-label="Ajuda e atalhos" title="Ajuda e atalhos (?)" aria-haspopup="dialog"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM6.1 6.2a2 2 0 1 1 2.9 1.8c-.6.3-1 .8-1 1.5M8 11.6v.1"/></svg></button>
<button type="button" class="primary"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg> Capturar</button>
<span class="me" tabindex="0" data-tip="Você: ana@exemplo.dev, do git config user.email"><span class="av" data-person="1" aria-hidden="true">an</span></span>
</div></header>
<section class="pulse" aria-hidden="true"><span class="pulse-cell skeleton" style="width:150px"></span><span class="pulse-cell skeleton" style="width:150px"></span><span class="pulse-cell skeleton" style="width:150px"></span><span class="pulse-cell skeleton" style="width:150px"></span><span class="pulse-cell skeleton" style="width:150px"></span><span class="pulse-cell skeleton" style="width:150px"></span></section>
<div></div>
<div class="shell"><main id="main" class="is-board"><p class="loading-line" role="status">Lendo o repositório de specs…</p><div class="board" aria-hidden="true"><section class="col" data-stage="captured"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Capturada</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section><section class="col" data-stage="ready"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Na fila</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section><section class="col" data-stage="approved"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Aprovada</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section><section class="col" data-stage="executing"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Em execução</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section><section class="col" data-stage="blocked"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Bloqueada</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section><section class="col" data-stage="review"><h2 class="col-head"><span class="col-toggle" style="display:flex;align-items:center"><span class="col-name">Em revisão</span><span class="count">·</span></span></h2><div class="col-body"><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div><div class="sk-card"><span class="sk w70"></span><span class="sk w95"></span><span class="sk w45"></span></div></div></section></div></main></div>
<footer class="statusbar">
<span class="conn-state unstable" role="status">instável</span>
<span class="fresh">carregando</span>
<button type="button" class="ghost icon small" aria-label="Pausar o auto-refresh" title="Pausar"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg></button>
<button type="button" class="ghost icon small" aria-label="Atualizar agora" title="Atualizar"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2v3h-3"/></svg></button>
<span class="grow"></span>
<span class="hint">pressione <kbd>?</kbd> para atalhos</span>
<button type="button" class="ghost small" aria-label="Notificações"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 11.5V7.2a4 4 0 0 1 8 0v4.3l1 1.2H3l1-1.2ZM6.6 14.5h2.8"/></svg> <span class="count">0</span></button>
</footer>
<div id="m-pri" class="menu" popover aria-label="Prioridade"><button type="button" class="ghost small" popovertarget="m-pri" popovertargetaction="hide"><span class="pri p1" title="prioridade P1">P1</span> crítica</button><button type="button" class="ghost small" popovertarget="m-pri" popovertargetaction="hide"><span class="pri p2" title="prioridade P2">P2</span> alta</button><button type="button" class="ghost small" popovertarget="m-pri" popovertargetaction="hide"><span class="pri" title="prioridade P3">P3</span> média</button><button type="button" class="ghost small" popovertarget="m-pri" popovertargetaction="hide"><span class="pri" title="prioridade P4">P4</span> baixa</button></div>
<div id="m-who" class="menu" popover aria-label="Responsável"><button type="button" class="ghost small" popovertarget="m-who" popovertargetaction="hide"><span class="av" data-person="1" aria-hidden="true">an</span> ana (você)</button><button type="button" class="ghost small" popovertarget="m-who" popovertargetaction="hide"><span class="av" data-person="2" aria-hidden="true">ru</span> rui</button><button type="button" class="ghost small" popovertarget="m-who" popovertargetaction="hide"><span class="av" data-person="3" aria-hidden="true">da</span> davi</button><button type="button" class="ghost small" popovertarget="m-who" popovertargetaction="hide">Remover responsável</button></div>
<div id="m-date" class="menu" popover aria-label="Alvo">
<label class="field">Alvo <input type="date" value="2026-11-03"></label>
<p class="field-hint">O prazo conta dias úteis, de segunda a sexta.</p>
<div class="chips"><button type="button" class="primary small" popovertarget="m-date" popovertargetaction="hide">Salvar</button>
<button type="button" class="ghost small" popovertarget="m-date" popovertargetaction="hide">Remover alvo</button></div></div>
<div id="m-filter" class="menu filter-menu" popover aria-label="Filtrar">
<label class="field">Qualquer palavra <input type="search" placeholder="Título, seções, tarefas, registros"></label>
<div class="filter-row"><select aria-label="Campo"><option>Etapa</option><option>Prioridade</option><option>Responsável</option><option>Assunto</option><option>Complexidade</option><option>Tag</option><option>Alvo</option><option>Título</option><option>Conteúdo</option></select><select aria-label="Condição"><option>contém</option><option>é</option><option>não é</option><option>vazio</option></select><input type="text" aria-label="Valor" placeholder="Valor"></div>
<div class="chips"><button type="button" class="ghost small"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg> Condição</button><span class="grow"></span>
<button type="button" class="primary small" popovertarget="m-filter" popovertargetaction="hide">Aplicar</button></div></div></div>
</body>
</html>
