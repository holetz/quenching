<div style="padding:16px;display:grid;gap:12px;"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="primary"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg> Capturar</button><button type="button" class="heat">Aprovar</button><button type="button">Cancelar</button><button type="button" class="ghost">Abrir</button><button type="button" class="link">ver a spec</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="primary small">Confirmar aprovação</button><button type="button" class="heat small">Aprovar</button><button type="button" class="small">Copiar comando</button><button type="button" class="ghost small">Abrir</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="ghost icon" aria-label="Ajuda"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM6.1 6.2a2 2 0 1 1 2.9 1.8c-.6.3-1 .8-1 1.5M8 11.6v.1"/></svg></button><button type="button" class="ghost icon small" aria-label="Copiar"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h7v8h-7zM3.5 10.5v-8h7"/></svg></button><button type="button" class="ghost small" aria-pressed="true">em execução</button><button type="button" class="ghost small" aria-pressed="false">bloqueadas</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="primary" disabled>Capturar</button><button type="button" disabled>Enviar</button><button type="button" class="ghost" disabled>Abrir</button></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">Decidir <span class="count hot">7</span> Épicos <span class="count">3</span> <kbd>Ctrl K</kbd> <kbd>g b</kbd></div></div>
