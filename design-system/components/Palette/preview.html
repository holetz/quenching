<li class="palette-item" role="option" aria-selected="false"><span class="palette-label"><span class="id">2140</span> Carregar o <mark>Gantt</mark> sem travar em stores com mais de 500 specs</span><span class="stage" data-stage="ready">pronta</span></li>

<div class="palette-foot"><kbd>↑</kbd> <kbd>↓</kbd> navegar · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> fechar</div></div></div>
