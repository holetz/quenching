# Local development site for this plugin repository. The published payload remains the source
# of truth; this checkout-level config makes `uv run zensical build` reproducible for contributors.
[project]
  site_name = "quenching — Documentation"
  site_description = "Documentation and operating contracts for the quenching plugin"
  # Local-only destination keeps sitemap generation deterministic without claiming a public host.
  site_url = "http://127.0.0.1:8000/"
  repo_url = "https://github.com/holetz/claude-quenching"
  # Zensical builds every Markdown file below docs_dir; unsupported exclude_docs/not_in_nav
  # settings cannot protect a high-volume knowledge home. `site-source/` is staged from the
  # bundle and never contains catalog/ or external/.
  docs_dir = "site-source"
  site_dir = "site"
  nav = [
    "index.md",
    { "Getting started" = [
      "tutorials/index.md",
      "tutorials/getting-started.md",
    ] },
    { "How-to guides" = [
      "how-to/index.md",
      "how-to/adopt-quenching.md",
      "how-to/converge-a-legacy-repository.md",
